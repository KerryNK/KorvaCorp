<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{% block title %}Korva Global Corporation{% endblock %}</title>
    <style>
      html { background: #000; color: #f7f7f5; font-family: Arial, Helvetica, sans-serif; }
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #000;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px 24px;
        box-sizing: border-box;
      }
      p { color: #a1a1aa; line-height: 1.7; }
      a { color: #f7f7f5; }
      footer {
        width: 100%;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding: 20px 24px 32px;
        box-sizing: border-box;
      }
      .footer-inner {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        color: #d4d4d8;
        font-size: 0.9rem;
      }
      .footer-links,
      .social-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .footer-links a,
      .social-links a {
        color: #f7f7f5;
        text-decoration: none;
      }
      .footer-links a:hover,
      .social-links a:hover {
        text-decoration: underline;
      }
      @media (max-width: 600px) {
        .footer-inner {
          justify-content: center;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      <div class="footer-inner">
        <div class="footer-links">
          <span>© 2026 Korva Global Corporation</span>
          <a href="#">Privacy Policy</a>
          <span>·</span>
          <a href="#">Terms of Use</a>
        </div>
        <div class="social-links">
          <a href="https://www.linkedin.com/company/korva-global-corporation/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://www.instagram.com/korva.corp/" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="https://x.com/korvaglobalcorp" target="_blank" rel="noopener noreferrer">X</a>
        </div>
      </div>
    </footer>
  </body>
</html>
