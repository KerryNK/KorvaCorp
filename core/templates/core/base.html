<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{% block title %}Korva Global Corporation{% endblock %}</title>
    <style>
      html { background: #000; color: #f7f7f5; font-family: Arial, Helvetica, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { max-width: 720px; padding: 48px 24px; }
      p { color: #a1a1aa; line-height: 1.7; }
      a { color: #f7f7f5; }
    </style>
  </head>
  <body>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
